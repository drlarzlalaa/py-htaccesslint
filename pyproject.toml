[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htaccesslint"
version = "0.1.0"
description = "Lint Apache .htaccess files offline: unbalanced containers, deprecated access rules, headers missing always, HSTS mistakes, typos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "drlarzlalaa" }]
keywords = ["apache", "htaccess", "lint", "security headers"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = []

[project.scripts]
htaccesslint = "htaccesslint.__main__:main"

[tool.setuptools]
packages = ["htaccesslint"]
